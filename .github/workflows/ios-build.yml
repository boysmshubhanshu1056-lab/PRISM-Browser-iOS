
name: PRISM iPad IPA Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "PRISM/**"
      - "PRISM.xcodeproj/**"
      - ".github/workflows/ios-build.yml"

jobs:
  build-ipa:
    name: Build PRISM for iPad
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build for physical iOS devices
        run: |
          set -euo pipefail

          xcodebuild \
            -project PRISM.xcodeproj \
            -scheme PRISM \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA for SideStore
        run: |
          set -euo pipefail

          APP_PATH="build/Build/Products/Release-iphoneos/PRISM.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: PRISM.app was not produced."
            find build -name "*.app" -maxdepth 8
            exit 1
          fi

          mkdir -p ipa/Payload
          cp -R "$APP_PATH" ipa/Payload/PRISM.app

          cd ipa
          /usr/bin/zip -qry ../PRISM-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PRISM-iPad-IPA
          path: PRISM-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
